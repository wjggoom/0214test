<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수업 일기 앱</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>수업 일기 앱</h1>
    <p class="subtitle">학생이 작성한 일기를 관리자가 바로 확인할 수 있어요.</p>

    <section class="card">
      <h2>학생 일기 작성</h2>
      <form id="diary-form">
        <label for="student_name">학생 이름</label>
        <input id="student_name" name="student_name" type="text" placeholder="예: 홍길동" required />

        <label for="content">오늘 수업 일기</label>
        <textarea id="content" name="content" rows="6" placeholder="오늘 배운 내용, 느낀 점을 작성하세요." required></textarea>

        <button type="submit">일기 제출</button>
      </form>
      <p id="form-message" class="form-message"></p>
    </section>

    <section class="card">
      <div class="admin-header">
        <h2>관리자 화면</h2>
        <button id="refresh-btn" type="button">새로고침</button>
      </div>
      <ul id="entry-list" class="entry-list"></ul>
      <p id="empty-message" class="empty-message">아직 등록된 일기가 없습니다.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
